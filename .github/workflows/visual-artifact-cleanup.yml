name: Visual Artifact Cleanup

on:
  workflow_dispatch:
  schedule:
    - cron: '37 */2 * * *'

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Delete visual artifacts older than four hours
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          cutoff_epoch=$(date -u -d '4 hours ago' +%s)
          deleted=0

          while IFS=$'\t' read -r artifact_id created_at artifact_name; do
            [[ -z "${artifact_id:-}" ]] && continue

            created_epoch=$(date -u -d "$created_at" +%s)
            if (( created_epoch <= cutoff_epoch )); then
              echo "Deleting $artifact_name ($artifact_id), created $created_at"
              gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
              deleted=$((deleted + 1))
            fi
          done < <(
            gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.name | startswith("visual-review-")) | [.id, .created_at, .name] | @tsv'
          )

          echo "Deleted $deleted visual review artifact(s)."
