name: Visual Review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/components/museum/**'
      - 'app/pages/museum/**'
      - 'app/layouts/**'
      - 'app/assets/css/**'
      - 'exhibits/**'
      - 'core/museum/**'
      - 'content/**'
      - 'playwright.config.ts'
      - 'tests/visual/**'
      - 'package.json'
      - '.github/workflows/visual-review.yml'

permissions:
  contents: read

concurrency:
  group: visual-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture visual states
        run: npm run test:visual

      - name: Upload visual review bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            visual-artifacts
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 1
          compression-level: 6
